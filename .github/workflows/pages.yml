name: Deploy dashboard

# 把 docs/index.html 数据看板发布到 GitHub Pages。
# 页面永远由 references/mirrors.json 现场重建，保证「页面」与「数据」不会各说各话。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "references/mirrors.json"
      - "scripts/build_dashboard.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 由数据库重建看板
        run: python3 scripts/build_dashboard.py

      - name: 自检（脏数据不上线）
        run: python3 scripts/selftest.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
